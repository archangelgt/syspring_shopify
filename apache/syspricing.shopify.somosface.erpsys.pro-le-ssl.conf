<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin gmorales@seraphsystems.com
    ServerName syspricing.shopify.somosface.erpsys.pro
    ServerAlias syspricing.shopify.somosface.erpsys.pro

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3012/ connectiontimeout=60 timeout=300
    ProxyPassReverse / http://127.0.0.1:3012/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/syspricing.shopify.somosface.erpsys.pro/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/syspricing.shopify.somosface.erpsys.pro/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateChainFile /etc/letsencrypt/live/syspricing.shopify.somosface.erpsys.pro/chain.pem
</VirtualHost>
</IfModule>
